[project]
name = "autogram"
version = "0.1.0"
description = "Schedule and publish content to an Instagram Business or Creator account from your own cloud storage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "requests",
    "pyyaml",
    "boto3",                    # GCS via S3-compatible XML API, and S3 itself
    "google-api-python-client", # Drive
    "google-auth",              # Drive credentials and token refresh
    "google-auth-oauthlib",     # one-time OAuth flow when minting a refresh token
    "pillow",                   # JPEG conversion (the one permitted transform)
    "pillow-heif",              # HEIC support — phones shoot HEIC
]

[project.optional-dependencies]
# moto gives the storage contract tests a real in-process S3 to run against,
# so the object-store backend is exercised rather than mocked.
dev = ["pytest", "ruff", "moto[s3]"]

[project.scripts]
autogram = "autogram.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
